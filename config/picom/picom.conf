backend = "glx";  # OpenGL backend

#border-width = 2;
#border-color = "#ffffff";
#frame-opacity = 0.9;
#frame-padding = 10;

# Enable rounded corners (already covered above)
rounded-corners = true;
corner-radius = 20;

# Enable shadows (optional)
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.7;
shadow-offset-x = -5;
shadow-offset-y = -5;

# Set transparency (optional)
inactive-opacity = 0.8;
active-opacity = 0.9;

