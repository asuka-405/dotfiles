# Set the background transparency (values between 0.0 and 1.0, where 1 is fully opaque)
background_opacity 0.85

# Set the background color to be transparent with a slight black tint
background #000000

# Make the text stand out with a clean, soft color scheme
foreground #E1E1E1
cursor #D8D8D8

# Set the color scheme to something pleasing and easy on the eyes
color0  #282828
color1  #e06c75
color2  #98c379
color3  #e5c07b
color4  #61afef
color5  #c678dd
color6  #56b6c2
color7  #abb2bf
color8  #5c6370
color9  #e06c75
color10 #98c379
color11 #e5c07b
color12 #61afef
color13 #c678dd
color14 #56b6c2
color15 #ffffff

# Use a nice font (ensure you have it installed on your system)
font_family Fira Code
font_size 12.0

# Set padding for the terminal window (in pixels)
window_padding_width 10


# Enable blur effect on the background (if your system supports it)
# blur_background true

# Set the cursor shape
cursor_shape block

# Adjust scrolling behavior
scrollback_lines 10000

# Enable smooth scrolling
scrollback_buffer_duration 200ms

# Set up custom window title
window_title_format {title}

# Enable line height to make the text look more spaced and relaxed
line_height 1.2

# Enable cursor blinking
cursor_blinking true

# Set default shell to Bash (or any shell of your choice)
shell /bin/zsh

# Add some subtle animations for window opening
window_opacity 0.9

